<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理画面 - Team NVN WeePA</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <main class="container">
        <p><a href="/">← トップへ</a></p>
        <h1>管理画面</h1>

        <section class="form">
            <div class="field">
                <label for="admin-user">Basic 認証ユーザー名 <span class="required">*</span></label>
                <input type="text" id="admin-user" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="admin-password">Basic 認証パスワード <span class="required">*</span></label>
                <input type="password" id="admin-password" autocomplete="current-password" required>
            </div>
            <div class="form-actions">
                <button type="button" id="load-btn">未承認一覧を再取得</button>
            </div>
            <p id="admin-result" class="result" role="status" aria-live="polite"></p>
        </section>

        <section class="event-card">
            <h2>未承認の選曲提案</h2>
            <div id="pending-songs" class="admin-list">
                <p class="loading">読み込み待ちです。</p>
            </div>
        </section>

        <section class="event-card">
            <h2>未承認のスコア投稿</h2>
            <div id="pending-scores" class="admin-list">
                <p class="loading">読み込み待ちです。</p>
            </div>
        </section>
    </main>

    <script src="/js/admin.js"></script>
</body>

</html>
