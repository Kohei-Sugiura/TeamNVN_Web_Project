<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team NVN</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="container">
    <header class="site-header">
      <h1>Team NVN</h1>
      <p class="subtitle">SOUND VOLTEX 交流チーム</p>
    </header>

    <section class="weepa-section">
      <article class="announcement">
        <header class="announcement-head">
          <span class="badge">WeePA</span>
        </header>
        <section class="weepa-status-card">
          <h3 class="weepa-status-title" id="weepa-status">読み込み中...</h3>
          <div class="weepa-status-body" id="weepa-current">
            <p class="loading">読み込み中...</p>
          </div>
        </section>
        <section class="weepa-status-card" id="weepa-latest-section" hidden>
          <h3 class="weepa-status-title">前回のランキング</h3>
          <div class="weepa-status-body" id="weepa-latest"></div>
        </section>
        <nav class="weepa-links">
          <a href="/submit.html">楽曲投稿フォーム</a>
          <span class="sep">|</span>
          <a href="/history.html">開催履歴</a>
        </nav>
      </article>
    </section>
  </main>

  <script src="/js/main.js"></script>
</body>
</html>
