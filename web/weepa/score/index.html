<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スコア投稿 - WeePA</title>
  <meta name="description" content="現在開催中の WeePA にスコアを投稿するフォーム。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Team NVN">
  <meta property="og:title" content="スコア投稿 - WeePA / Team NVN">
  <meta property="og:description" content="現在開催中の WeePA にスコアを投稿するフォーム。">
  <meta property="og:image" content="https://team-nvn-server.com/image/WeePA_icon.png">
  <meta property="og:url" content="https://team-nvn-server.com/weepa/score/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="スコア投稿 - WeePA / Team NVN">
  <meta name="twitter:description" content="現在開催中の WeePA にスコアを投稿するフォーム。">
  <meta name="twitter:image" content="https://team-nvn-server.com/image/WeePA_icon.png">
  <link rel="icon" type="image/png" href="/image/TeamNVN_icon.png">
    <link rel="apple-touch-icon" href="/image/TeamNVN_icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Noto+Sans+JP:wght@400;700&display=swap">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
  <main class="container">
    <header class="site-header">
      <h1><a href="/"><img class="site-header-logo" src="/image/TeamNVN_icon.png" alt=""><span class="site-header-name">Team NVN</span></a></h1>
      <p class="subtitle">SOUND VOLTEX 交流チーム</p>
    </header>
    <img class="weepa-page-mark" src="/image/WeePA_icon.png" alt="WeePA">
    <h1>スコア投稿</h1>
    <p>現在開催中の WeePA にスコアを投稿します。</p>

    <section class="event-card">
      <div id="event-display" class="event-display">
        <p class="loading">読み込み中...</p>
      </div>
    </section>

    <p id="result" class="result" role="status" aria-live="polite"></p>

    <form id="score-form" class="form" novalidate enctype="multipart/form-data" hidden>
      <div class="field">
        <label for="xId">X (Twitter) ID <span class="required">*</span></label>
        <input type="text" id="xId" name="xId" required maxlength="100" placeholder="@abc_player">
        <p class="hint">例: @abc_player</p>
        <p class="error" data-for="xId"></p>
      </div>

      <div class="field">
        <label for="submitName">投稿者名 <span class="required">*</span></label>
        <input type="text" id="submitName" name="submitName" required maxlength="50">
        <p class="error" data-for="submitName"></p>
      </div>

      <div class="field">
        <label for="score">スコア <span class="required">*</span></label>
        <input type="number" id="score" name="score" required min="0" max="10000000" step="1" inputmode="numeric">
        <p class="hint">0 〜 10,000,000</p>
        <p class="error" data-for="score"></p>
      </div>

      <div class="field">
        <label for="exScore">EXスコア</label>
        <input type="number" id="exScore" name="exScore" min="0" step="1" inputmode="numeric">
        <p class="hint">EXスコアがある場合のみ入力（任意）</p>
        <p class="error" data-for="exScore"></p>
      </div>

      <div class="field">
        <label for="image">リザルト画像 <span class="required">*</span></label>
        <input type="file" id="image" name="image" required accept="image/jpeg,image/png,image/webp,image/*">
        <p class="hint">JPEG / PNG / WebP、最大 20 MB（スマホで撮影したリザルト画像を添付）</p>
        <p class="error" data-for="image"></p>
      </div>

      <div class="form-actions">
        <button type="submit" id="submit-btn">スコアを投稿する</button>
      </div>
    </form>

    <dialog id="confirm-dialog" class="confirm-dialog">
      <h3>投稿内容の確認</h3>
      <div class="dialog-body" id="confirm-body"></div>
      <div class="dialog-actions">
        <button type="button" id="confirm-cancel" class="cancel">戻る</button>
        <button type="button" id="confirm-ok">投稿する</button>
      </div>
    </dialog>
  </main>

  <script src="/js/score.js"></script>
</body>

</html>
