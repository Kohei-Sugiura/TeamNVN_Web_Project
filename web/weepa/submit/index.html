<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>楽曲投稿 - WeePA</title>
  <meta name="description" content="WeePA で取り上げる楽曲を提案するフォーム。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Team NVN">
  <meta property="og:title" content="楽曲投稿 - WeePA / Team NVN">
  <meta property="og:description" content="WeePA で取り上げる楽曲を提案するフォーム。">
  <meta property="og:image" content="https://team-nvn-server.com/image/WeePA_icon.png">
  <meta property="og:url" content="https://team-nvn-server.com/weepa/submit/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="楽曲投稿 - WeePA / Team NVN">
  <meta name="twitter:description" content="WeePA で取り上げる楽曲を提案するフォーム。">
  <meta name="twitter:image" content="https://team-nvn-server.com/image/WeePA_icon.png">
  <link rel="icon" type="image/png" href="/image/TeamNVN_icon.png">
    <link rel="apple-touch-icon" href="/image/TeamNVN_icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Noto+Sans+JP:wght@400;700&display=swap">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
  <main class="container">
    <header class="site-header">
      <h1><a href="/"><img class="site-header-logo" src="/image/TeamNVN_icon.png" alt=""><span class="site-header-name">Team NVN</span></a></h1>
      <p class="subtitle" data-i18n="site.subtitle">SOUND VOLTEX 交流チーム</p>
    </header>
    <img class="weepa-page-mark" src="/image/WeePA_icon.png" alt="WeePA">
    <h1 data-i18n="weepa.submit.title">楽曲投稿</h1>
    <p data-i18n="weepa.submit.desc">WeePAでやりたい曲を投稿してください。</p>

    <p id="result" class="result" role="status" aria-live="polite"></p>

    <form id="submit-form" class="form" novalidate>
      <div class="field">
        <label for="xId"><span data-i18n="weepa.submit.label.xid">X (Twitter) ID</span> <span class="required">*</span></label>
        <input type="text" id="xId" name="xId" required maxlength="100" placeholder="@abc_player">
        <p class="hint" data-i18n="weepa.submit.hint.xid">例: @abc_player</p>
        <p class="error" data-for="xId"></p>
      </div>

      <div class="field">
        <label for="submitName"><span data-i18n="weepa.submit.label.name">投稿者名</span> <span class="required">*</span></label>
        <input type="text" id="submitName" name="submitName" required maxlength="50">
        <p class="error" data-for="submitName"></p>
      </div>

      <div class="field">
        <label for="song"><span data-i18n="weepa.submit.label.song">楽曲名</span> <span class="required">*</span></label>
        <input type="text" id="song" name="song" required maxlength="200" autocomplete="off">
        <p class="hint" data-i18n="weepa.submit.hint.song">正式名称で入力してください</p>
        <p class="error" data-for="song"></p>
      </div>

      <div class="field">
        <label for="effect"><span data-i18n="weepa.submit.label.effect">譜面種</span> <span class="required">*</span></label>
        <select id="effect" name="effect" required>
          <option value="" data-i18n="weepa.submit.effect.select">-- 選択してください --</option>
          <option value="NOV">NOV (Novice)</option>
          <option value="ADV">ADV (Advanced)</option>
          <option value="EXH">EXH (Exhaust)</option>
          <option value="MXM">MXM (Maximum)</option>
          <option value="INF">INF (Infinite)</option>
          <option value="GRV">GRV (Gravity)</option>
          <option value="HVN">HVN (Heavenly)</option>
          <option value="VVD">VVD (Vivid)</option>
          <option value="XCD">XCD (Exceed)</option>
          <option value="NBL">NBL (Nabra)</option>
          <option value="ULT">ULT (Ultimate)</option>
        </select>
        <p class="error" data-for="effect"></p>
      </div>

      <div class="field">
        <label for="submitReason" data-i18n="weepa.submit.reason.opt">選曲理由（任意）</label>
        <textarea id="submitReason" name="submitReason" maxlength="500" rows="4"></textarea>
        <p class="hint" data-i18n="weepa.submit.hint.reason">誰が見てもわかる範囲で</p>
        <p class="error" data-for="submitReason"></p>
      </div>

      <div class="form-actions">
        <button type="submit" id="submit-btn" data-i18n="weepa.submit.button">提案を送信</button>
      </div>
    </form>

    <dialog id="confirm-dialog" class="confirm-dialog">
      <h3 data-i18n="weepa.submit.confirm.title">投稿内容の確認</h3>
      <div class="dialog-body" id="confirm-body"></div>
      <div class="dialog-actions">
        <button type="button" id="confirm-cancel" class="cancel" data-i18n="common.back">戻る</button>
        <button type="button" id="confirm-ok" data-i18n="common.submit">投稿する</button>
      </div>
    </dialog>
  </main>

  <script src="/js/i18n-dict.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/submit.js"></script>
</body>

</html>
