<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DB管理: イベント - Team NVN WeePA</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <main class="container">
        <p><a href="/">← トップへ</a></p>
        <div id="admin-nav"></div>
        <h1>DB管理: イベント (weepa_events)</h1>

        <p id="status" class="result" role="status" aria-live="polite"></p>

        <section class="event-card">
            <h2>新規作成</h2>
            <form id="create-form" class="form">
                <div class="field">
                    <label for="c-weepaSongId">weepa_song_id <span class="required">*</span></label>
                    <input type="number" id="c-weepaSongId" name="weepaSongId" required min="1">
                </div>
                <div class="field">
                    <label for="c-startDate">開始日時 <span class="required">*</span></label>
                    <input type="datetime-local" id="c-startDate" name="startDate" required>
                </div>
                <div class="field">
                    <label for="c-endDate">終了日時 <span class="required">*</span></label>
                    <input type="datetime-local" id="c-endDate" name="endDate" required>
                </div>
                <div class="form-actions">
                    <button type="submit">作成</button>
                </div>
            </form>
        </section>

        <section class="ranking-section">
            <h2>一覧</h2>
            <div id="list">
                <p class="loading">読み込み中...</p>
            </div>
        </section>
    </main>

    <script src="/js/admin-common.js"></script>
    <script src="/js/admin-events.js"></script>
</body>

</html>
