<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公開前プレビュー - ムンチャレ管理</title>
    <link rel="icon" type="image/png" href="/image/TeamNVN_icon.png">
    <link rel="apple-touch-icon" href="/image/TeamNVN_icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Noto+Sans+JP:wght@400;700&display=swap">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <main class="container">
        <header class="site-header">
            <h1><a href="/"><img class="site-header-logo" src="/image/TeamNVN_icon.png" alt=""><span class="site-header-name">Team NVN</span></a></h1>
            <p class="subtitle">SOUND VOLTEX 交流チーム</p>
        </header>
        <p><a href="/admin/msc/?tab=publish">← 公開設定に戻る</a></p>
        <div id="admin-nav"></div>
        <h1>公開前プレビュー</h1>
        <p class="hint">未公開 MSC イベントのランキングを管理者だけが先に確認するページです。一般ユーザーには公開前なので見えません。</p>

        <section id="event-section" class="event-card" hidden>
            <div id="event-display" class="event-display">
                <p class="loading">読み込み中...</p>
            </div>
            <p id="publish-status" class="result"></p>
        </section>

        <section id="ranking-section" class="ranking-section" hidden>
            <h2>ランキング</h2>
            <div id="ranking-display">
                <p class="loading">読み込み中...</p>
            </div>
        </section>
    </main>

    <script src="/js/admin-common.js"></script>
    <script src="/js/msc-ranking-table.js"></script>
    <script src="/js/admin-msc-preview.js"></script>
</body>

</html>
