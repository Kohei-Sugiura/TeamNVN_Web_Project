<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理画面 - Team NVN WeePA</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <main class="container">
        <p><a href="/">← トップへ</a></p>
        <div id="admin-nav"></div>
        <h1>WeePA 管理</h1>

        <nav class="inner-tabs" id="admin-tabs">
            <button type="button" data-tab="songs" class="active">楽曲承認</button>
            <button type="button" data-tab="scores">スコア承認</button>
            <button type="button" data-tab="schedule">開催スケジュール</button>
        </nav>

        <div class="form-actions">
            <button type="button" id="load-btn">再読み込み</button>
        </div>
        <p id="admin-result" class="result" role="status" aria-live="polite"></p>

        <section class="event-card admin-tab-panel" data-tab="songs">
            <h2>楽曲承認待ち</h2>
            <div id="pending-songs" class="admin-list">
                <p class="loading">読み込み中...</p>
            </div>
        </section>

        <section class="event-card admin-tab-panel" data-tab="scores" hidden>
            <h2>スコア承認待ち</h2>
            <div id="pending-scores" class="admin-list">
                <p class="loading">読み込み中...</p>
            </div>
        </section>

        <section class="event-card admin-tab-panel" data-tab="schedule" hidden>
            <h2>現在開催中</h2>
            <div id="schedule-current">
                <p class="loading">読み込み中...</p>
            </div>

            <h2 style="margin-top:24px;">開催キュー (承認済み・未開催)</h2>
            <p class="hint">承認済み楽曲を「次に開催する順」で並べます。↑↓ で順番を入れ替えて「順番を保存」してください。</p>
            <div id="schedule-queue">
                <p class="loading">読み込み中...</p>
            </div>
            <div class="form-actions">
                <button type="button" id="reorder-save-btn">順番を保存</button>
                <button type="button" id="trigger-btn">今すぐ次回イベントを生成</button>
            </div>

            <h2 style="margin-top:24px;">過去のイベント</h2>
            <p class="hint">end_date を過ぎたイベント。「公開」を押すと結果がランキング詳細ページから見られるようになります。</p>
            <div id="schedule-past">
                <p class="loading">読み込み中...</p>
            </div>

            <h2 style="margin-top:24px;">自動生成設定</h2>
            <div id="schedule-config">
                <p class="loading">読み込み中...</p>
            </div>
        </section>
    </main>

    <script src="/js/admin-common.js"></script>
    <script src="/js/admin.js"></script>
</body>

</html>
