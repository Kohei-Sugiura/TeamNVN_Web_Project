<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DB管理: 楽曲 - Team NVN WeePA</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <main class="container">
        <p><a href="/">← トップへ</a></p>
        <div id="admin-nav"></div>
        <h1>DB管理: 楽曲 (weepa_songs)</h1>

        <p id="status" class="result" role="status" aria-live="polite"></p>

        <section class="event-card">
            <h2>新規作成</h2>
            <form id="create-form" class="form">
                <div class="field">
                    <label for="c-song">楽曲名 <span class="required">*</span></label>
                    <input type="text" id="c-song" name="song" required maxlength="200">
                </div>
                <div class="field">
                    <label for="c-effect">譜面種 <span class="required">*</span></label>
                    <input type="text" id="c-effect" name="effect" required maxlength="10" placeholder="EXH / MXM / GRV ...">
                </div>
                <div class="field">
                    <label for="c-xId">X ID <span class="required">*</span></label>
                    <input type="text" id="c-xId" name="xId" required>
                </div>
                <div class="field">
                    <label for="c-submitName">投稿者名 <span class="required">*</span></label>
                    <input type="text" id="c-submitName" name="submitName" required>
                </div>
                <div class="field">
                    <label for="c-submitReason">提案理由</label>
                    <textarea id="c-submitReason" name="submitReason" rows="2"></textarea>
                </div>
                <div class="field">
                    <label for="c-approvalStatus">approval_status</label>
                    <select id="c-approvalStatus" name="approvalStatus">
                        <option value="-1">-1 却下</option>
                        <option value="0" selected>0 未承認</option>
                        <option value="1">1 承認済み</option>
                        <option value="2">2 実施済み</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit">作成</button>
                </div>
            </form>
        </section>

        <section class="ranking-section">
            <h2>一覧</h2>
            <div id="list">
                <p class="loading">読み込み中...</p>
            </div>
        </section>
    </main>

    <script src="/js/admin-common.js"></script>
    <script src="/js/admin-songs.js"></script>
</body>

</html>
