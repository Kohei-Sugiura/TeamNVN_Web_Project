services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      - db
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Host=db;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ADMIN_BASIC_USER: ${ADMIN_BASIC_USER}
      ADMIN_BASIC_PASSWORD: ${ADMIN_BASIC_PASSWORD}
    volumes:
      - uploads:/app/uploads
    networks:
      - internal

  scheduler:
    build: ./scheduler
    restart: unless-stopped
    depends_on:
      - api
    environment:
      ADMIN_BASIC_USER: ${ADMIN_BASIC_USER}
      ADMIN_BASIC_PASSWORD: ${ADMIN_BASIC_PASSWORD}
      AUTO_WEEKLY_TRIGGER_CRON: ${AUTO_WEEKLY_TRIGGER_CRON:-5 0 * * *}
      AUTO_WEEKLY_TRIGGER_URL: http://api:8080/api/admin/events/auto-weekly
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./web:/var/www/html:ro
      - uploads:/var/www/uploads:ro
    networks:
      - internal

volumes:
  db_data:
  uploads:

networks:
  internal:
    driver: bridge
