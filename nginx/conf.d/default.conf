# SSL 化後の nginx 設定テンプレート。
# deploy/setup-ssl.sh が team-nvn-server.com を実ドメインに置換して default.conf として配置する。
# 手で編集してそのまま使うことも可。

map $request_method $public_post_key {
    POST    $binary_remote_addr;
    default "";
}

limit_req_zone $binary_remote_addr zone=admin_api:10m rate=30r/m;
limit_req_zone $public_post_key   zone=public_post:10m rate=10r/m;

upstream weepa_api {
    server api:8080;
}

# --- HTTP: ACME challenge + HTTPS リダイレクト ---
server {
    listen 80;
    listen [::]:80;
    server_name team-nvn-server.com;

    # Let's Encrypt 更新用
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: 本体 ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name team-nvn-server.com;

    ssl_certificate     /etc/letsencrypt/live/team-nvn-server.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/team-nvn-server.com/privkey.pem;

    # Mozilla intermediate (TLS 1.2 + 1.3)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS (まずは半年。問題なさそうなら 1 年に伸ばす)
    add_header Strict-Transport-Security "max-age=15552000" always;

    client_max_body_size 20M;

    root /var/www/html;
    index index.html;

    location /uploads/ {
        alias /var/www/uploads/;
        expires 1h;
    }

    location /api/admin/ {
        limit_req zone=admin_api burst=15 nodelay;
        limit_req_status 429;

        proxy_pass http://weepa_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/songs {
        limit_req zone=public_post burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://weepa_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/events/[0-9]+/scores$ {
        limit_req zone=public_post burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://weepa_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://weepa_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # HTML/JS/CSS は常に再検証させる (304 で安価)。
        # 無指定だとブラウザのヒューリスティックキャッシュで古い JS/CSS が
        # 配信され、「ブラウザによって翻訳/CSS が効かない」事象を起こすため。
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}

# --- 内部用 (Docker network 内のみ): puppeteer 等が SSR/PNG 化目的で叩く ---
# HTTPS リダイレクトせず、認証無しで素直に静的ファイル + /api/* を返す。
# host にはポート公開しない (compose の ports に追加しないので外部から到達不可)。
server {
    listen 8081;
    server_name _;

    client_max_body_size 20M;

    root /var/www/html;
    index index.html;

    location /uploads/ {
        alias /var/www/uploads/;
    }

    location /api/ {
        proxy_pass http://weepa_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
