# SSL 化後の nginx 設定テンプレート。
# deploy/setup-ssl.sh が team-nvn-server.com を実ドメインに置換して default.conf として配置する。
# 手で編集してそのまま使うことも可。

map $request_method $public_post_key {
    POST    $binary_remote_addr;
    default "";
}

limit_req_zone $binary_remote_addr zone=admin_api:10m rate=30r/m;
limit_req_zone $public_post_key   zone=public_post:10m rate=10r/m;
# OCR は Claude API 課金を伴うため専用ゾーン (アプリ側 3/min の手前の DoS 対策層)
limit_req_zone $public_post_key   zone=ocr_post:10m rate=6r/m;

server_tokens off;

# Discord interactions の 3 秒期限切り分け用: 応答時間付きログ
log_format apitime '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                   'rt=$request_time urt=$upstream_response_time conn=$connection#$connection_requests';

upstream weepa_api {
    server api:8080;
}

# --- HTTP: ACME challenge + HTTPS リダイレクト ---
server {
    listen 80;
    listen [::]:80;
    server_name team-nvn-server.com;

    # Let's Encrypt 更新用
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: 本体 ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name team-nvn-server.com;

    ssl_certificate     /etc/letsencrypt/live/team-nvn-server.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/team-nvn-server.com/privkey.pem;

    # Mozilla intermediate (TLS 1.2 + 1.3)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS (まずは半年。問題なさそうなら 1 年に伸ばす)
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 20M;

    root /var/www/html;
    index index.html;

    location /uploads/ {
        alias /var/www/uploads/;
        expires 1h;
    }

    location /api/admin/ {
        limit_req zone=admin_api burst=15 nodelay;
        limit_req_status 429;

        proxy_pass http://weepa_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/songs {
        limit_req zone=public_post burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://weepa_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # スコア投稿: モバイル回線+大きい画像で 60s では切れる事例があったため
    # アップロード本文の読込タイムアウトを 180s に延長。
    location ~ ^/api/events/[0-9]+/scores$ {
        limit_req zone=public_post burst=3 nodelay;
        limit_req_status 429;
        client_body_timeout 180s;

        proxy_pass http://weepa_api;
        proxy_http_version 1.1;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MSC スコア投稿 (multipart で複数画像): 同様に 180s 化
    location ~ ^/api/msc/events/[0-9]+/submissions$ {
        limit_req zone=public_post burst=3 nodelay;
        limit_req_status 429;
        client_body_timeout 180s;

        proxy_pass http://weepa_api;
        proxy_http_version 1.1;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 画像 OCR (Anthropic 経由): こちらも本文受信に余裕を見ておく
    location = /api/score/recognize {
        limit_req zone=ocr_post burst=5 nodelay;
        limit_req_status 429;
        client_body_timeout 180s;

        proxy_pass http://weepa_api;
        proxy_http_version 1.1;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        access_log /dev/stdout apitime;

        proxy_pass http://weepa_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # HTML/JS/CSS は常に再検証させる (304 で安価)。
        # 無指定だとブラウザのヒューリスティックキャッシュで古い JS/CSS が
        # 配信され、「ブラウザによって翻訳/CSS が効かない」事象を起こすため。
        # 注意: location に add_header を書くと server レベルの分は継承されないため
        # セキュリティヘッダ一式をここにも再掲する。
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ =404;
    }
}

# --- 内部用 (Docker network 内のみ): puppeteer 等が SSR/PNG 化目的で叩く ---
# HTTPS リダイレクトせず、認証無しで素直に静的ファイル + /api/* を返す。
# host にはポート公開しない (compose の ports に追加しないので外部から到達不可)。
server {
    listen 8081;
    server_name _;

    client_max_body_size 20M;

    root /var/www/html;
    index index.html;

    location /uploads/ {
        alias /var/www/uploads/;
    }

    location /api/ {
        proxy_pass http://weepa_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
