# レート制限ゾーン定義（http context、conf.d/*.conf は http に include される）
# - admin_api: 管理APIへのリクエスト全般。ブルートフォース対策。
# - public_post: 公開POST (楽曲提案・スコア投稿)。スパム対策。
#   POST 以外はキー空文字 → カウントされない仕様で「POST だけ制限」を実現。
map $request_method $public_post_key {
    POST    $binary_remote_addr;
    default "";
}

limit_req_zone $binary_remote_addr zone=admin_api:10m rate=30r/m;
limit_req_zone $public_post_key   zone=public_post:10m rate=10r/m;

upstream weepa_api {
    server api:8080;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    root /var/www/html;
    index index.html;

    # 承認待ち画像の配信
    location /uploads/ {
        alias /var/www/uploads/;
        expires 1h;
    }

    # 管理API: 認証付き全エンドポイントにレート制限
    # 30 req/min + burst 15。1 IP からのブルートフォースを実用的に阻止
    location /api/admin/ {
        limit_req zone=admin_api burst=15 nodelay;
        limit_req_status 429;

        proxy_pass http://weepa_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 公開: 楽曲提案 POST のみ厳しめ
    location = /api/songs {
        limit_req zone=public_post burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://weepa_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 公開: スコア投稿 POST のみ厳しめ（multipart 含む）
    location ~ ^/api/events/[0-9]+/scores$ {
        limit_req zone=public_post burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://weepa_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # その他 API: GET 中心、特に制限なし
    location /api/ {
        proxy_pass http://weepa_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静的ファイル（見つからなければ 404、SPA 風フォールバックはしない）
    location / {
        try_files $uri $uri/ =404;
    }
}
